<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>在线讨论</title>
<style>
body {
  background-color: #1e293b;
  color: #fff;
  margin: 0;
  padding: 30px 15px;
  font-family: sans-serif;
}
.container {
  max-width: 650px;
  margin: 0 auto;
}
.back-btn {
  color: #93c5fd;
  text-decoration: none;
  border: 1px solid #93c5fd55;
  padding: 6px 16px;
  border-radius: 20px;
  display: inline-block;
  margin-bottom: 20px;
}
h2 {
  color: #93c5fd;
  margin-bottom: 25px;
  text-align: center;
}
/* 强制评论区可见、深色模式 */
#giscus-container {
  background: #273444;
  padding: 15px;
  border-radius: 12px;
  min-height: 300px;
}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-btn">← 返回主页</a>
  <h2>在线讨论区</h2>

  <!-- 评论容器单独隔离，绝不被遮挡 -->
  <div id="giscus-container"></div>

</div>

<!-- Giscus 标准正确写法 放在最底部 -->
<script src="https://giscus.app/client.js"
        data-repo="shanmu9178/shanmu9178.github.io"
        data-repo-id="R_kgDOSGgjaw"
        data-category="Announcements"
        data-category-id="DIC_kwDOSGgja84C7mQy"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="dark"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
</script>
<!-- 全局播放器iframe（隐藏） -->
<iframe id="playerIframe" src="player.html" style="display:none;"></iframe>
<script>
const player=document.getElementById('playerIframe');
// 发指令给播放器
function playerCmd(type,idx){
  player.contentWindow.postMessage({type,idx},'*');
}
// 接收播放器发来的歌名更新
window.addEventListener('message',e=>{
  if(e.data&&e.data.type==='song'){
    let el=document.getElementById('songName');
    if(el)el.innerText=e.data.name;
  }
});
</script>

</body>
</html>
