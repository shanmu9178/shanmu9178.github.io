<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐页面 | 一个不知名的小破站</title>
    <style>
        /* 这里放你之前写的美化样式，不变 */
        * {margin: 0;padding: 0;box-sizing: border-box;}
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: "Microsoft Yahei", sans-serif;
            padding: 40px 20px;
            color: #eee;
        }
        .container {max-width: 680px;margin: 0 auto;}
        h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #74b9ff, #a29bfe);
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }
        .music-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        .song-name {
            font-size: 22px;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .song-desc {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 35px;
        }
        .list-title {
            margin: 0 0 20px;
            color: #a29bfe;
            font-size: 16px;
            text-align: left;
        }
        .song-item {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            border: 1px solid transparent;
        }
        .song-item:hover {
            background: rgba(116,185,255,0.1);
            border-color: rgba(116,185,255,0.2);
            transform: translateX(4px);
        }
        .back-btn {
            display: block;
            width: fit-content;
            margin: 40px auto 0;
            padding: 12px 30px;
            background: rgba(116,185,255,0.15);
            color: #74b9ff;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            transition:0.3s;
            border: 1px solid rgba(116,185,255,0.2);
        }
        .back-btn:hover{
            background:rgba(116,185,255,0.25);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>音乐合集</h2>
        <div class="music-card">
            <div class="song-name" id="songName">点击下方歌单播放音乐</div>
            <div class="song-desc">轻听舒缓 · 沉浸式背景音乐</div>

            <h3 class="list-title">📜 全部歌单</h3>
            <div id="songList">
                <div class="song-item" onclick="playSong(0)">纯音乐 01</div>
                <div class="song-item" onclick="playSong(1)">治愈单曲 02</div>
                <div class="song-item" onclick="playSong(2)">轻音乐 03</div>
                <div class="song-item" onclick="playSong(3)">首页背景音乐</div>
            </div>
        </div>
        <a href="home.html" class="back-btn">← 返回首页</a>
    </div>

    <script>
        // 发送指令给全局播放器
        function playSong(index) {
            // 发送消息给父页面（index.html里的播放器）
            window.parent.postMessage({
                type: 'playSong',
                index: index
            }, '*');
            // 更新当前页面的歌名显示
            const songNames = ["纯音乐 01", "治愈单曲 02", "轻音乐 03", "首页背景音乐"];
            document.getElementById('songName').innerText = songNames[index];
        }
    </script>
</body>
</html>
