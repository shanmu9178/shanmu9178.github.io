<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐页面 | 一个不知名的小破站</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;}
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: "Microsoft Yahei", sans-serif;
            padding: 40px 20px;
            color: #eee;
        }
        .container {max-width: 680px;margin: 0 auto;}
        h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #74b9ff, #a29bfe);
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }
        /* 音乐主卡片 毛玻璃美化 */
        .music-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        /* 旋转唱片封面 */
        .disc-wrap {
            width: 180px;
            height: 180px;
            margin: 0 auto 30px;
            position: relative;
        }
        .disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #2d3436, #636e72);
            box-shadow: 0 0 20px rgba(116,185,255,0.3);
            animation: rotate 20s linear infinite;
            animation-play-state: paused;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .disc::after {
            content: "";
            width: 30px;
            height: 30px;
            background: #1a1a2e;
            border-radius: 50%;
        }
        /* 播放时唱片旋转 */
        .disc.play {animation-play-state: running;}
        @keyframes rotate {
            0%{transform: rotate(0deg);}
            100%{transform: rotate(360deg);}
        }
        .song-name {
            font-size: 22px;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .song-desc {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 35px;
        }
        /* 控制按钮美化 */
        .ctrl-box {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .ctrl-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(116,185,255,0.15);
            color: #74b9ff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(116,185,255,0.2);
        }
        .ctrl-btn:hover {
            background: rgba(116,185,255,0.3);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(116,185,255,0.25);
        }
        .play-main {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg,#74b9ff,#a29bfe);
            color: #fff;
        }
        /* 歌单样式 */
        .list-title {
            margin: 0 0 20px;
            color: #a29bfe;
            font-size: 16px;
            text-align: left;
        }
        .song-item {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            border: 1px solid transparent;
        }
        .song-item:hover {
            background: rgba(116,185,255,0.1);
            border-color: rgba(116,185,255,0.2);
            transform: translateX(4px);
        }
        .back-btn {
            display: block;
            width: fit-content;
            margin: 40px auto 0;
            padding: 12px 30px;
            background: rgba(116,185,255,0.15);
            color: #74b9ff;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            transition:0.3s;
            border: 1px solid rgba(116,185,255,0.2);
        }
        .back-btn:hover{
            background:rgba(116,185,255,0.25);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>音乐合集</h2>
        <div class="music-card">
            <!-- 旋转唱片 -->
            <div class="disc-wrap">
                <div class="disc" id="disc"></div>
            </div>

            <div class="song-name" id="songName">等待播放</div>
            <div class="song-desc">轻听舒缓 · 沉浸式背景音乐</div>

            <div class="ctrl-box">
                <button class="ctrl-btn" onclick="playerCmd('prev')">⏮</button>
                <button class="ctrl-btn play-main" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="ctrl-btn" onclick="playerCmd('next')">⏭</button>
            </div>

            <h3 class="list-title">📜 全部歌单</h3>
            <div id="songList">
                <div class="song-item" onclick="playerCmd('load',0)">纯音乐 01</div>
                <div class="song-item" onclick="playerCmd('load',1)">治愈单曲 02</div>
                <div class="song-item" onclick="playerCmd('load',2)">轻音乐 03</div>
                <div class="song-item" onclick="playerCmd('load',3)">首页背景音乐</div>
            </div>
        </div>
        <a href="index.html" class="back-btn">← 返回首页</a>
    </div>

<!-- 全局播放器iframe 跨页不断播 -->
<iframe id="playerIframe" src="player.html" style="display:none;"></iframe>
<script>
const player=document.getElementById('playerIframe');
const disc = document.getElementById('disc');
const playBtn = document.getElementById('playBtn');

// 发送播放指令
function playerCmd(type,idx){
  player.contentWindow.postMessage({type,idx},'*');
}

// 播放暂停切换 + 唱片动画
let isPlay = false;
function togglePlay(){
    if(!isPlay){
        playerCmd('play');
        playBtn.innerText = "⏸";
        disc.classList.add("play");
    }else{
        playerCmd('pause');
        playBtn.innerText = "▶";
        disc.classList.remove("play");
    }
    isPlay = !isPlay;
}

// 同步歌曲名称
window.addEventListener('message',e=>{
  if(e.data&&e.data.type==='song'){
    let el=document.getElementById('songName');
    if(el)el.innerText=e.data.name;
  }
});
</script>
</body>
</html>
