<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>照片库</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {
    min-height: 100vh;
    background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460);
    background-size: 400% 400%;
    animation: bgFlow 12s ease infinite;
    color: #f8fafc;
    padding: 20px;
}
@keyframes bgFlow {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
.back {
    display: inline-block;
    padding: 10px 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 25px;
    color: #7dd3fc;
    text-decoration: none;
}
h2 {margin: 30px 0 15px; color:#7dd3fc;}
.upload-btn {
    background: #38bdf8;
    color: #000;
    font-weight: bold;
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    display: inline-block;
    margin-bottom:20px;
}
#gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
}
#gallery img {
    width:100%;
    border-radius:12px;
}
</style>
</head>
<body>
<a href="index.html" class="back">← 返回主页</a>

<h2>照片库</h2>

<!-- 上传按钮 -->
<label class="upload-btn">
    上传照片
    <input type="file" id="photoInput" accept="image/*" style="display:none">
</label>

<!-- 照片展示区 -->
<div id="gallery"></div>

<script>
let gallery = document.getElementById('gallery');
let photoInput = document.getElementById('photoInput');

// 页面加载时读取本地保存的照片
let savedPhotos = JSON.parse(localStorage.getItem('myPhotos') || '[]');
savedPhotos.forEach(src=>addPhoto(src));

// 选图上传预览+保存
photoInput.onchange=e=>{
    let file = e.target.files[0];
    if(!file)return;
    let reader=new FileReader();
    reader.onload=ev=>{
        let src=ev.target.result;
        addPhoto(src);
        // 保存到浏览器本地
        savedPhotos.push(src);
        localStorage.setItem('myPhotos',JSON.stringify(savedPhotos));
    };
    reader.readAsDataURL(file);
};

// 添加图片到页面
function addPhoto(src){
    let img=document.createElement('img');
    img.src=src;
    gallery.appendChild(img);
}
</script>

</body>
</html>
