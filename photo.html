<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>照片相册</title>
<style>
* {margin: 0;padding: 0;box-sizing: border-box;}
body {
    background: linear-gradient(-45deg,#0f172a,#1e293b,#253b56,#142840);
    background-size: 400% 400%;
    animation: gradientBg 14s ease infinite;
    min-height: 100vh;
    font-family: "微软雅黑",sans-serif;
    color: #fff;padding: 20px;
}
@keyframes gradientBg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
.container {max-width: 500px;margin: 40px auto 0;}
.back-btn {
    display: inline-block;text-decoration: none;color: #93c5fd;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;padding: 10px 20px;margin-bottom: 30px;
}
h2 {text-align: center;color: #93c5fd;margin-bottom: 20px;}
.photo-grid {
    display: grid;grid-template-columns: 1fr 1fr;
    gap: 10px;margin-top: 15px;
}
.photo-grid img {
    width: 100%;border-radius: 12px;
    object-fit: cover;
}
.tip {color:#ccc;text-align:center;margin:10px 0;font-size:14px;}
</style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-btn">← 返回主页</a>
    <h2>照片相册</h2>
    <div class="photo-grid" id="photoGrid"></div>
</div>
!-- 全局无缝音乐 -->
 <audio id="globalBgm" loop preload="auto" style="position:fixed;bottom:-9999px;opacity:0;pointer-events:none;">
     <source src="bgm.mp3" type="audio/mpeg">
 <script>
 const bgm = document.getElementById('globalBgm');
 if(localStorage.getItem('globalBgmState') === 'play'){
     bgm.play().catch(()=>{});
 }
 bgm.addEventListener('play',()=>localStorage.setItem('globalBgmState','play'));
 bgm.addEventListener('pause',()=>localStorage.setItem('globalBgmState','pause'));
 // 在此填写你的图片名
 const imgList = [
     "IMG_20260424_224337.jpg","IMG_20260424_224308.jpg","IMG_20260424_224243.jpg","IMG_20260424_224227.jpg","IMG_20260424_224201.jpg","IMG_20260424_224438.jpg","IMG_20260424_224621.jpg","IMG_20260424_224640.jpg"
 ];
 ];
 ];
 const grid = document.getElementById("photoGrid");
 imgList.forEach(n=>{
     let i = document.createElement("img");
     i.src = "images/"+n;
     grid.appendChild(i);
 })
 </script>

</body>
</html>
