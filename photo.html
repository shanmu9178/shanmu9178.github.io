<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片相册</title>
<style>
* {margin: 0;padding: 0;box-sizing: border-box;}
body {
    background: #1e293b;
    min-height: 100vh;
    font-family: "微软雅黑",sans-serif;
    color: #fff;padding: 20px;
}
.container {max-width: 500px;margin: 40px auto 0;}
.back-btn {
    display: inline-block;text-decoration: none;color: #93c5fd;
    border: 1px solid rgba(147,197,253,0.4);
    border-radius: 20px;padding: 8px 20px;margin-bottom: 30px;
}
h2 {text-align: center;color: #93c5fd;margin-bottom: 20px;}
.photo-grid {
    display: grid;grid-template-columns: 1fr 1fr;
    gap: 10px;margin-top: 15px;
}
.photo-grid img {
    width: 100%;border-radius: 12px;
    object-fit: cover;
}
</style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-btn">← 返回主页</a>
    <h2>照片相册</h2>
    <div class="photo-grid" id="photoGrid"></div>
</div>

<audio id="globalBgm" loop preload="auto" style="position:fixed;bottom:-9999px;opacity:0;pointer-events:none;">
    <source src="bgm.mp3" type="audio/mpeg">


<script>
const bgm = document.getElementById('globalBgm');
if(localStorage.getItem('globalBgmState') === 'play'){
    bgm.play().catch(()=>{});
}
bgm.addEventListener('play',()=>localStorage.setItem('globalBgmState','play'));
bgm.addEventListener('pause',()=>localStorage.setItem('globalBgmState','pause'));

// 图片路径改成 assets/images/
const imgList = [
    "IMG_20260424_224337.jpg",
    "IMG_20260424_224308.jpg",
    "IMG_20260424_224243.jpg",
    "IMG_20260424_224227.jpg",
    "IMG_20260424_224438.jpg",
    "IMG_20260424_224201.jpg",
    "IMG_20260424_224621.jpg",
    "IMG_20260424_224640.jpg"
 
];

const grid = document.getElementById("photoGrid");
imgList.forEach(n=>{
    let i = document.createElement("img");
    // 关键修改：加上 assets/
    i.src = "assets/images/"+n;
    i.loading = "lazy";
    grid.appendChild(i);
})
</script>
</body>
</html>
