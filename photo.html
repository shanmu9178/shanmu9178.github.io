<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片相册</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #1e293b;
    min-height: 100vh;
    font-family: "微软雅黑",sans-serif;
    color: #fff;
    padding: 40px 20px;
}
.container {
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
}
.back-btn {
    display: inline-block;
    text-decoration: none;
    color: #93c5fd;
    border: 1px solid rgba(147,197,253,0.4);
    border-radius: 20px;
    padding: 8px 20px;
    margin-bottom: 30px;
}
h2 {
    color: #93c5fd;
    margin-bottom: 20px;
}
.photo-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}
.photo-grid img {
    width: 100%;
    border-radius: 12px;
    object-fit: cover;
}
.music-wrap {
    margin-top: 30px;
}
.music-btn {
    padding: 10px 20px;
    border-radius: 30px;
    border: 1px solid rgba(147,197,253,0.4);
    background: rgba(30, 41, 59, 0.9);
    color: #93c5fd;
    font-size: 14px;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-btn">← 返回主页</a>
    <h2>照片相册</h2>
    <div class="photo-grid" id="photoGrid"></div>

    <!-- 内嵌音乐按钮 -->
    <div class="music-wrap">
        <button class="music-btn" id="musicBtn">播放音乐</button>
    </div>
</div>

<!-- 全局无缝音乐 -->
<audio id="globalBgm" loop preload="auto" style="position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;">
    <source src="bgm.mp3" type="audio/mpeg">

<script>
const bgm = document.getElementById('globalBgm');
const musicBtn = document.getElementById('musicBtn');
const state = localStorage.getItem('globalBgmState');

// 恢复播放状态
if(state === 'play'){
    bgm.play().catch(e=>{});
    musicBtn.innerText = "暂停音乐";
}else{
    musicBtn.innerText = "播放音乐";
}

// 状态监听
bgm.addEventListener('play', ()=>{
    localStorage.setItem('globalBgmState','play');
    musicBtn.innerText = "暂停音乐";
})
bgm.addEventListener('pause', ()=>{
    localStorage.setItem('globalBgmState','pause');
    musicBtn.innerText = "播放音乐";
})

// 开关按钮
musicBtn.onclick = () => {
    if(bgm.paused){
        bgm.play();
    }else{
        bgm.pause();
    }
}

// 照片列表（请修改为你的图片文件名）
const imgList = [
    "IMG_20260424_224337.jpg",
    "IMG_20260424_224308.jpg",
    "IMG_20260424_224243.jpg",
    "IMG_20260424_224227.jpg"
    "IMG_20260424_224438.jpg",
    "IMG_20260424_224201.jpg",
    "IMG_20260424_224621.jpg",
    "IMG_20260424_224640.jpg"
];
const grid = document.getElementById("photoGrid");
imgList.forEach(n=>{
    let i = document.createElement("img");
    i.src = "assets/images/"+n;
    grid.appendChild(i);
})
</script>
</body>
</html>
