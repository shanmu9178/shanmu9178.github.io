<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线讨论</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #1e293b;
    min-height: 100vh;
    font-family: "微软雅黑",sans-serif;
    color: #fff;
    padding: 40px 20px;
}
.container {
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
}
.back-btn {
    display: inline-block;
    text-decoration: none;
    color: #93c5fd;
    border: 1px solid rgba(147,197,253,0.4);
    border-radius: 20px;
    padding: 8px 20px;
    margin-bottom: 30px;
}
h2 {
    color: #93c5fd;
    margin-bottom: 20px;
}
/* 评论区容器 */
#comments {
    text-align: left;
    margin-top: 20px;
    margin-bottom: 30px;
}
.music-wrap {
    margin-top: 30px;
}
.music-btn {
    padding: 10px 20px;
    border-radius: 30px;
    border: 1px solid rgba(147,197,253,0.4);
    background: rgba(30, 41, 59, 0.9);
    color: #93c5fd;
    font-size: 14px;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-btn">← 返回主页</a>
    <h2>在线讨论</h2>

    <!-- 【关键】评论区容器，必须放在正文里 -->
    <div id="comments"></div>

    <!-- 音乐按钮 -->
    <div class="music-wrap">
        <button class="music-btn" id="musicBtn">播放音乐</button>
    </div>
</div>

<!-- 全局音乐 -->
<audio id="globalBgm" loop preload="auto" style="position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;">
    <source src="bgm.mp3" type="audio/mpeg">

<script>
const bgm = document.getElementById('globalBgm');
const musicBtn = document.getElementById('musicBtn');
const state = localStorage.getItem('globalBgmState');

if(state === 'play'){
    bgm.play().catch(e=>{});
    musicBtn.innerText = "暂停音乐";
}else{
    musicBtn.innerText = "播放音乐";
}

bgm.addEventListener('play', ()=>{
    localStorage.setItem('globalBgmState','play');
    musicBtn.innerText = "暂停音乐";
})
bgm.addEventListener('pause', ()=>{
    localStorage.setItem('globalBgmState','pause');
    musicBtn.innerText = "播放音乐";
})

musicBtn.onclick = () => {
    bgm.paused ? bgm.play() : bgm.pause();
}
</script>

<!-- 【关键】Giscus 评论脚本，必须放在 #comments 容器后面 -->
<script src="https://giscus.app/client.js"
        data-repo="shanmu9178/shanmu9178.github.io"
        data-repo-id="R_kgDOSGgjaw"
        data-category="Announcements"
        data-category-id="DIC_kwDOSGgja84C7mQy"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="dark"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
</script>
</body>
</html>
