<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一个不知名的小破站</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;}
        body {background: linear-gradient(135deg, #1a1a2e, #16213e);min-height: 100vh;}
        /* 主页面容器 */
        #mainFrame {width: 100%;height: calc(100vh - 80px);border: none;}
        /* 底部固定播放器栏 */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 9999;
        }
        .player-btn {
            background: rgba(116,185,255,0.2);
            color: #74b9ff;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            transition: 0.3s;
        }
        .player-btn:hover {background: rgba(116,185,255,0.4);}
        .song-title {color: #fff;}
    </style>
</head>
<body>
    <!-- 主页面内容：所有子页面都在这里加载 -->
    <iframe id="mainFrame" src="home.html"></iframe>

    <!-- 底部固定播放器（永远不消失） -->
    <div class="player-bar">
        <div class="song-title" id="songTitle">等待播放</div>
        <button class="player-btn" id="prevBtn">⏮</button>
        <button class="player-btn" id="playBtn">▶</button>
        <button class="player-btn" id="nextBtn">⏭</button>
    </div>

    <!-- 核心：全局播放器，永远在后台 -->
    <audio id="bgAudio" loop>

    <script>
        // 歌单配置，在这里添加你的所有歌曲
        const songList = [
            {name:"纯音乐 01", src:"assets/music1.mp3"},
            {name:"治愈单曲 02", src:"assets/music2.mp3"},
            {name:"轻音乐 03", src:"assets/music3.mp3"},
            {name:"首页背景音乐", src:"assets/bgm.mp3"}
        ];
        let currentIndex = 0;
        const audio = document.getElementById('bgAudio');
        const songTitle = document.getElementById('songTitle');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let isPlaying = false;

        // 加载歌曲
        function loadSong(index) {
            currentIndex = index;
            audio.src = songList[index].src;
            songTitle.innerText = songList[index].name;
            audio.play();
            isPlaying = true;
            playBtn.innerText = "⏸";
        }

        // 播放/暂停
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playBtn.innerText = "▶";
                isPlaying = false;
            } else {
                audio.play();
                playBtn.innerText = "⏸";
                isPlaying = true;
            }
        });

        // 上一首
        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + songList.length) % songList.length;
            loadSong(currentIndex);
        });

        // 下一首
        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % songList.length;
            loadSong(currentIndex);
        });

        // 子页面发送切歌指令（比如music.html里点击歌单）
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'playSong') {
                loadSong(e.data.index);
            }
        });
    </script>
</body>
</html>
