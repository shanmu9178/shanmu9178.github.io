<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #1e293b;
    min-height: 100vh;
    font-family: "微软雅黑",sans-serif;
    color: #fff;
    padding: 60px 20px 40px;
}
.container {
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
}
.title {
    font-size: 28px;
    color: #93c5fd;
    margin-bottom: 40px;
}
.nav-item {
    display: block;
    text-decoration: none;
    color: #fff;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 14px;
    margin: 12px 0;
    transition: 0.3s;
}
.nav-item:hover {
    background: rgba(255,255,255,0.05);
}
/* 按钮放在页面底部，和其他元素一样 */
.music-wrap {
    margin-top: 30px;
}
.music-btn {
    padding: 10px 20px;
    border-radius: 30px;
    border: 1px solid rgba(147,197,253,0.4);
    background: rgba(30, 41, 59, 0.9);
    color: #93c5fd;
    font-size: 14px;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
    <h1 class="title">我的个人主页</h1>
    <a href="photo.html" class="nav-item">📷 照片相册</a>
    <a href="talk.html" class="nav-item">💬 在线讨论</a>
    <a href="music.html" class="nav-item">🎵 音乐页面</a>
    <a href="reward.html" class="nav-item">🎁 打赏支持</a>
    <a href="soft.html" class="nav-item">💻 软件分享</a>
    <a href="web.html" class="nav-item">🌐 网站合集</a>
    <a href="tool.html" class="nav-item">🛠️ 实用工具</a>
    <a href="about.html" class="nav-item">👤 关于本站</a>

    <!-- 按钮放在这里，页面底部，预览里一定能看到 -->
    <div class="music-wrap">
        <button class="music-btn" id="musicBtn">播放音乐</button>
    </div>
</div>

<!-- 全局无缝背景音乐 -->
<audio id="globalBgm" loop preload="auto" style="position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;">
    <source src="bgm.mp3" type="audio/mpeg">

<script>
const bgm = document.getElementById('globalBgm');
const musicBtn = document.getElementById('musicBtn');
const state = localStorage.getItem('globalBgmState');

// 恢复播放状态
if(state === 'play'){
    bgm.play().catch(e=>{});
    musicBtn.innerText = "暂停音乐";
}else{
    musicBtn.innerText = "播放音乐";
}

// 状态监听
bgm.addEventListener('play', ()=>{
    localStorage.setItem('globalBgmState','play');
    musicBtn.innerText = "暂停音乐";
})
bgm.addEventListener('pause', ()=>{
    localStorage.setItem('globalBgmState','pause');
    musicBtn.innerText = "播放音乐";
})

// 开关按钮
musicBtn.onclick = () => {
    if(bgm.paused){
        bgm.play();
    }else{
        bgm.pause();
    }
}
</script>
</body>
</html>
