<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一个不知名的小破站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: "Microsoft Yahei", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            letter-spacing: 3px;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #74b9ff, #a29bfe);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(116, 185, 255, 0.3);
        }

        /* 按钮卡片 */
        .menu-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .menu-item::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(116, 185, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .menu-item:hover {
            background: rgba(116, 185, 255, 0.1);
            border-color: rgba(116, 185, 255, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .menu-item:hover::before {
            left: 100%;
        }

        .menu-title {
            color: #fff;
            font-size: 17px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            margin-left: 28px;
        }

        /* 音乐按钮 */
        .music-btn {
            display: block;
            margin: 40px auto 0;
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            background: rgba(116, 185, 255, 0.2);
            color: #74b9ff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            background: rgba(116, 185, 255, 0.4);
            transform: scale(1.05);
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
            }
            .menu-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>一个不知名的小破站</h1>

        <div class="menu-item" onclick="location.href='photo.html'">
            <div class="menu-title">📷 照片相册</div>
            <div class="menu-desc">记录生活里的碎片瞬间，随手拍的日常和截图都在这里</div>
        </div>

        <div class="menu-item">
            <div class="menu-title">💬 在线讨论</div>
            <div class="menu-desc">留言、吐槽、闲聊，任何想法都可以在这里留下痕迹</div>
        </div>

        <div class="menu-item">
            <div class="menu-title">🎵 音乐页面</div>
            <div class="menu-desc">我的私藏歌单分享，有治愈也有emo，随时在线循环</div>
        </div>

        <div class="menu-item">
            <div class="menu-title">🎁 打赏支持</div>
            <div class="menu-desc">如果你觉得这个小破站还不错，可以请我喝杯奶茶</div>
        </div>

        <div class="menu-item">
            <div class="menu-title">💻 软件分享</div>
            <div class="menu-desc">自用的实用工具、效率软件，无套路免费分享</div>
        </div>

        <div class="menu-item">
            <div class="menu-title">🌐 网站合集</div>
            <div class="menu-desc">收藏夹里的宝藏网站，学习、摸鱼、提升效率都有</div>
        </div>

        <div class="menu-item">
            <div class="menu-title">🛠️ 实用工具</div>
            <div class="menu-desc">在线小工具合集，图片处理、文本工具、格式转换等</div>
        </div>

        <div class="menu-item">
            <div class="menu-title">👤 关于本站</div>
            <div class="menu-desc">这个小破站的由来、作者碎碎念和更新说明</div>
        </div>

        <button class="music-btn" id="musicBtn">暂停音乐</button>
    </div>

    <!-- 继承原有的背景音乐 -->
    <audio id="bgm" loop>
        <!-- 这里填你的音乐文件路径，比如 assets/bgm.mp3 -->
        <source src="assets/bgm.mp3" type="audio/mpeg">
    

    <script>
        const bgm = document.getElementById("bgm");
        const musicBtn = document.getElementById("musicBtn");
        let isPlaying = false;

        // 页面加载后自动播放（部分浏览器需要用户交互后才能播放）
        window.addEventListener("load", () => {
            // 尝试自动播放
            bgm.play().then(() => {
                isPlaying = true;
                musicBtn.textContent = "暂停音乐";
            }).catch(() => {
                // 自动播放失败时，提示用户点击播放
                musicBtn.textContent = "点击播放音乐";
            });
        });

        // 按钮控制播放/暂停
        musicBtn.addEventListener("click", () => {
            if (isPlaying) {
                bgm.pause();
                musicBtn.textContent = "播放音乐";
                isPlaying = false;
            } else {
                bgm.play();
                musicBtn.textContent = "暂停音乐";
                isPlaying = true;
            }
        });

        // 给相册页面加音乐联动（可选，跳转相册时暂停/继续）
        document.querySelector("[onclick*='photo.html']").addEventListener("click", () => {
            // 你可以在这里设置跳转相册时暂停音乐
            // bgm.pause();
        });
    </script>
</body>
</html>
