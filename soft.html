<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>软件分享库</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background: linear-gradient(-45deg,#0f172a,#1e293b,#273444,#0f172a);
            background-size:400% 400%;
            animation:bgMove 15s ease infinite;
            color:#eee;min-height:100vh;padding:20px;
        }
        @keyframes bgMove{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }
        .box{max-width:1000px;margin:0 auto;}
        .back{display:inline-block;padding:10px 20px;background:rgba(255,255,255,0.1);border-radius:8px;color:#fff;text-decoration:none;margin-bottom:20px;}
        .icon{font-size:36px;color:#60a5fa;margin-bottom:12px;}
        h2{margin-bottom:15px;}
    </style>
</head>
<body>
    <audio id="bgMusic" loop preload="auto">
        <source src="https://music.163.com/song/media/outer/url?id=41534902.mp3" type="audio/mpeg">
    
    <div class="box">
        <a href="index.html" class="back"><i class="fa fa-arrow-left"></i> 返回主页</a>
        <i class="fa fa-desktop icon"></i>
        <h2>软件分享库</h2>
        <p>电脑、手机实用软件、破解工具、资源合集。</p>
    </div>
    <script>
        const audio=document.getElementById("bgMusic");
        document.addEventListener("click",()=>audio.play(),{once:true});
    </script>
</body>
</html>
